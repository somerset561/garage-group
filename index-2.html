<title>Garage Group</title>
<style>
:root{--bg:#0c0c0e;--card:#16161a;--card2:#1d1d22;--line:#2a2a31;--tx:#ececf1;--mut:#8d8d98;--acc:#ff6a1a;--ok:#2ecc71;--bad:#ff4d5e;--blue:#3d9bff;--gold:#f5c542}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{--acc:#ff6a1a;max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}

.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;letter-spacing:.14em;font-size:17px;display:flex;align-items:center;gap:8px}
.brand b{color:var(--acc);margin-left:5px}
.cbrand{display:flex;align-items:center;gap:8px}.cbrand .logo{font-size:26px;margin:0}.cbrand .cn{font-weight:900;font-size:17px;color:var(--acc);line-height:1.1}.cbrand small{font-size:10px;letter-spacing:.12em;color:var(--mut)}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none}.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg) inset}
.chead h1{color:var(--acc)}
.tire{width:20px;height:20px;border-radius:50%;border:4px dashed #555;box-shadow:inset 0 0 0 3px #0c0c0e,inset 0 0 0 6px #777}
.bell{position:relative;background:none;border:0;font-size:20px;padding:4px 6px;cursor:pointer}
.bell i,nav i{position:absolute;top:-2px;right:-4px;background:var(--acc);color:#fff;font:700 10px/16px sans-serif;min-width:16px;height:16px;border-radius:8px;font-style:normal;padding:0 4px}
.roles{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--mut)}
.roles button{flex:1;background:var(--card2);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:6px 4px;font-size:12px;font-weight:600;cursor:pointer}
.roles button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:12px 14px}
h1{font-size:22px;margin:6px 0 4px}h2{font-size:15px;margin:22px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}h3{margin:0 0 4px;font-size:16px}
p{margin:4px 0}.sub{color:var(--mut);font-size:13px;margin:4px 0 12px}.meta{color:var(--mut);font-size:13px}.meta.big{font-size:15px;color:var(--tx)}
.empty{color:var(--mut);text-align:center;padding:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row.end{justify-content:flex-end}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{background:var(--acc);color:#fff;border:1px solid var(--acc);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.sm{padding:6px 10px;font-size:13px}.btn.wide{display:block;width:100%;margin:10px 0}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--line)}.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.danger{background:var(--bad);border-color:var(--bad)}.btn.ghost.danger{background:transparent;color:var(--bad);border-color:#4a2a2f}
.btn:disabled{opacity:.6}
textarea,input,select{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--acc)}
input.plain{background:none;border:0;padding:2px 0;font-weight:700;font-size:17px}input.plain.sm{font-weight:400;font-size:13px;color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 0}label input,label select,label textarea{margin-top:4px}
label.chk{display:flex;gap:8px;align-items:flex-start;color:var(--tx)}label.chk input{width:auto;margin-top:3px}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--tx);white-space:nowrap}
.chip.sm{font-size:10px;padding:1px 6px;vertical-align:middle}.chip.bad{color:var(--bad)}.chip.prem{color:var(--gold);border-color:#5a4a1a}
.vb{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;font-weight:900;margin-left:5px;vertical-align:middle}
.logo{font-size:18px;margin-right:6px}.logo.big{font-size:30px}.logo.xl{font-size:44px}
.who{display:flex;align-items:center;gap:4px;font-size:14px;margin-bottom:4px}.who .t{margin-left:auto;color:var(--mut);font-size:12px}
.club{display:flex;align-items:center;gap:10px;cursor:pointer}
.chead{display:flex;gap:12px;align-items:center;margin-top:6px}
.back{background:none;border:0;color:var(--acc);font-size:15px;font-weight:600;padding:4px 0;cursor:pointer}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:14px 0 4px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px 4px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:0 0 0 1px var(--line)}
.seg.sm{margin:0;flex:1}
.ev{padding:0;overflow:hidden;cursor:pointer}.evb{padding:10px 12px 12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#2b2b33;text-transform:uppercase;letter-spacing:.04em}
.tag.rideout{background:#3a2412;color:#ffb27a}.tag.meet{background:#12283a;color:#8cc6ff}.tag.merged{background:#2d1a3a;color:#d3a6ff}.tag.feat{background:#3a3212;color:var(--gold)}
.pres{font-size:13px;margin-top:6px;color:var(--mut)}.pres b{color:var(--tx)}
.map{display:block;width:100%;height:auto;background:#1b1e24}.map.big{border-radius:12px;border:1px solid var(--line);margin:10px 0}
.map.tap{cursor:crosshair}
.pinrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.pinrow:last-child{border-bottom:0}
.pinrow input{flex:1;min-width:0}
.pn{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.av{width:32px;height:32px;border-radius:50%;background:#2b2b33;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}.av.big{width:52px;height:52px;font-size:22px;background:var(--acc)}
.x{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;width:32px;height:32px;cursor:pointer;flex:none}
.lnk{cursor:pointer;color:var(--tx);text-decoration:underline;text-decoration-color:var(--line)}
.mini{font-size:13px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.mini.pending{border-color:#5a4a1a}.mini.rejected{border-color:#5a2a30}
.note{margin-top:6px;color:var(--mut);font-style:italic}
.pinned{background:#2a2112;border:1px solid #5a4a1a;border-radius:10px;padding:8px 10px;font-size:13px;margin:10px 0}
.chat{max-height:52vh;overflow:auto;padding:6px 0}
.msg{margin:8px 0;max-width:85%}.msg.me{margin-left:auto;text-align:right}
.mu{font-size:12px;color:var(--mut);margin-bottom:2px}
.bub{display:inline-block;background:var(--card2);border:1px solid var(--line);padding:8px 11px;border-radius:14px;text-align:left}
.msg.me .bub{background:var(--acc);border-color:var(--acc);color:#fff}
.mod{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}.msg.me .mod{justify-content:flex-end}
.mod button{background:none;border:1px solid var(--line);color:var(--mut);font-size:11px;border-radius:6px;padding:2px 6px;cursor:pointer}
.chatin{display:flex;gap:8px;margin-top:8px}.chatin input{flex:1}
.deal{font-size:14px;margin-top:6px}.deal.prem{color:var(--gold)}.deal.locked{color:var(--mut)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}.ph .x{position:absolute;top:4px;right:4px;width:24px;height:24px;font-size:11px;background:rgba(0,0,0,.6)}
.ph.add{display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--mut);cursor:pointer;margin:0}
.vimg{width:calc(100% + 24px);margin:-12px -12px 10px;display:block;max-height:220px;object-fit:cover;border-radius:14px 14px 0 0}
.hp{display:inline-block;margin-top:2px;font-weight:800;color:var(--acc);font-size:13px}
.log{font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}.log span{color:var(--mut);margin-right:6px}
.premc{border-color:#5a4a1a;background:linear-gradient(160deg,#1d1a10,#16161a)}.premc ul{margin:8px 0;padding-left:18px;color:var(--tx)}
.stat{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:4px}.stat b{color:var(--tx)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;background:rgba(16,16,19,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{position:relative;flex:1;max-width:96px;background:none;border:0;color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:4px 0}
nav button span{font-size:19px;filter:grayscale(1);opacity:.7}nav button.on{color:var(--acc)}nav button.on span{filter:none;opacity:1}
nav i{top:0;right:18%}
#modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#modal .box{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
#modal h2{margin-top:0;color:var(--tx);text-transform:none;letter-spacing:0;font-size:19px}
.mcard{border-radius:16px;padding:18px;background:linear-gradient(135deg,#222 0%,#0c0c0e 60%,#3a1b08 100%);border:1px solid #444;margin:10px 0}
.mcard .code{font:800 22px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;margin-top:14px}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.fc{perspective:900px;cursor:pointer}
.fc-in{position:relative;aspect-ratio:5/7;transition:transform .6s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden;border:3px solid var(--cc);background:#111;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.face.fr img,.face.fr svg{width:100%;height:100%;object-fit:cover;display:block}
.face.bk{transform:rotateY(180deg);padding:10px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(170deg,#1d1d23,#0c0c0e)}
.fbadge{position:absolute;top:6px;left:6px;right:6px;font-size:10px;font-weight:700;background:rgba(0,0,0,.65);padding:3px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bh{background:var(--cc);color:#fff;margin:-10px -10px 4px;padding:6px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmm{font-weight:800;font-size:13px;line-height:1.2;text-transform:uppercase}
.bhp{font-size:11px;color:var(--mut)}.bhp b{font-size:24px;color:var(--cc);margin-right:2px}
.blbl{font-size:10px;text-transform:uppercase;color:var(--mut);letter-spacing:.06em;margin-top:2px}
.bmods{font-size:11.5px;line-height:1.3;overflow:auto;flex:1;min-height:0}
.bso{display:flex;flex-direction:column;gap:3px;font-size:12px}.bso a{color:var(--tx);text-decoration:none;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tapb{font-size:9px;color:var(--mut);text-align:center}
.gact{display:flex;gap:6px;margin-top:6px}.gact button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:6px;font-size:13px;cursor:pointer}
.gst{font-size:12px;margin-top:6px;color:var(--mut);text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-top:6px}
.chips button{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;white-space:nowrap;cursor:pointer}.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fc.gold .face{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 16px rgba(245,197,66,.35)}
.fc.gold .fband .yr{color:var(--gold)}
.drow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}
.dc{flex:none;width:118px;scroll-snap-align:start}.dc .fc-in{aspect-ratio:4/5}.dc .face{border-width:2px}
.dfront{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:8px;text-align:center;gap:4px;background:linear-gradient(160deg,#202027,#0f0f12)}
.dfront .dl{font-size:30px}.dfront b{font-size:12px;line-height:1.2}.dfront span{font-size:10px;color:var(--mut)}

.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dgrid .dc{width:auto}
.prog{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--gold)}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.pgrid .ph{margin:0}
.ph .main{position:absolute;bottom:3px;left:3px;font-size:9px;background:var(--acc);color:#fff;padding:1px 4px;border-radius:4px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#26262d;border:1px solid var(--line);color:var(--tx);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:20;max-width:90%;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

  :'<path d="M10 64q2-14 20-17l15-11q8-5 20-5h13q11 1 18 12l12 3q8 2 8 12v6z" fill="#0b0b0d"/><path d="M50 38h14v9H40zM68 38h9q6 1 10 9H68z" fill="'+col+'" opacity=".35"/><circle cx="33" cy="65" r="9" fill="#0b0b0d" stroke="'+col+'" stroke-width="2"/><circle cx="95" cy="65" r="9" fill="#0b0b0d" stroke="'+col+'" stroke-width="2"/>';

function readImg(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)}

 if(d.d==='kind'&&draft){draft.kind=t.value;if(t.value==='meet')draft.pins=draft.pins.slice(0,1);renderEventForm(true)}
 if(d.d==='pub'&&draft)draft.pub=t.checked;
 if(d.f==='gallery'){[...t.files].slice(0,6).forEach(f=>readImg(f,u=>{S.me.gallery.push(u);if(!save()){S.me.gallery.pop();toast('Storage is full on this device')}render()}))}
 if(d.f==='vphoto'&&vdraft){const room=maxPhotos()-vdraft.photos.length;if(t.files.length>room)toast('Only '+maxPhotos()+' photos per vehicle'+(S.premium?'':'. Premium gets 5.'));[...t.files].slice(0,room).forEach(f=>readImg(f,u=>{if(vdraft&&vdraft.photos.length<maxPhotos()){vdraft.photos.push(u);renderVehicleForm()}}))}
 if(d.me)render()});
document.addEventListener('change',e=>{if(e.target.id==='brColor'){const c=C(e.target.dataset.c);if(c){c.color=e.target.value;save();render()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cmIn'){const b=document.querySelector('[data-a="addComment"]');if(b)A.addComment(b)}
 if(e.key==='Enter'&&e.target.id==='chatIn'){const b=document.querySelector('[data-a="chatSend"]');if(b)A.chatSend(b)}});
render();
</script>
